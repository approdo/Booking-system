# Checks every push and pull request: the site (lint, types, unit and end-to-end tests, static build) and
# the booking API in worker/ (types, tests in the Workers runtime with a local D1, a dry-run bundle).
#
# On `main` of the public repository (or with the repository variable DEPLOY_PAGES = 'true'), it then
# deploys, in this order (BK-005 scope 10, BK-011):
#   1. the API: checks the two Cloudflare secrets, creates the D1 database "booking-system" if it does
#      not exist yet, applies the migrations and deploys the Worker "booking-system-api" with the
#      production settings of worker/wrangler.toml ([env.production]: only the live site may call it);
#   2. the site: GitHub Pages, only after the API is up.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions), set by the owner:
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template plus "Account · D1 · Edit"
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the token belongs to
# They are read through `secrets.` only and never printed. Only the steps that run wrangler, and the
# step that checks they are set, get them, in their own `env:` (D-011 L4): installing dependencies never
# sees them. The D1 database id is looked up at deploy time and written into worker/wrangler.toml on the
# runner only (never committed).
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the Pages job may publish to Pages.
permissions:
  contents: read

env:
  # No usage data from wrangler.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: Lint, test and build
    # Every job pins an Ubuntu release instead of the moving "latest" label, so the OS
    # that `playwright install --with-deps` sets up changes only on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          # .nvmrc holds only the major version; check-latest takes its newest release,
          # which meets the minimum in package.json "engines".
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the API's dependencies
        run: npm ci --prefix worker

      - name: Lint
        run: npm run lint

      # Nuxt's typecheck, then the Worker's (tsc in worker/).
      - name: Typecheck
        run: npm run typecheck

      # The site's unit tests, then the Worker's tests in the Workers runtime with a local D1
      # (npm run test:worker): no Cloudflare account, no network.
      - name: Unit tests
        run: npm run test:unit

      - name: Bundle the API (dry run, no account)
        run: npm run check:worker

      # The build for the tests: its pages call the API on the runner (http://localhost:8787), which
      # Playwright starts with an empty local D1. @nuxt/fonts downloads the font while building. If this
      # step fails with ENOTFOUND or "fetch failed" for a font host, the host was unreachable: re-run the job.
      - name: Generate the static site for the tests
        run: npm run generate:local

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Playwright starts `npm run preview`, which serves the output of the generate step
      # under the path of site.url, so this has to come after it.
      - name: End-to-end tests
        run: npm run test:e2e

      # Stops here while site.url is still the template's example address, so a client site never
      # goes live with links that lead nowhere. GITHUB_REPOSITORY is set by GitHub Actions.
      - name: Check site.url before the deploy
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (github.event.repository.visibility == 'public' || vars.DEPLOY_PAGES == 'true')
        run: npm run check:site-url

      # The build that goes live: the same pages, calling the live API (site.apiUrl) instead of the
      # runner's. It replaces the test build in .output/public (tests/unit/deployWorkflow.test.ts).
      - name: Generate the static site for GitHub Pages
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (github.event.repository.visibility == 'public' || vars.DEPLOY_PAGES == 'true')
        run: npm run generate

      - name: Upload the site for GitHub Pages
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (github.event.repository.visibility == 'public' || vars.DEPLOY_PAGES == 'true')
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy-api:
    name: Deploy the API to Cloudflare
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event.repository.visibility == 'public' || vars.DEPLOY_PAGES == 'true')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deployment at a time, and a running deployment is never cancelled halfway.
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    # No secrets here: a job's env reaches every step, `npm ci` included. Each step that needs them has
    # its own env (tests/unit/deployWorkflow.test.ts).
    steps:
      # Fails with a clear message instead of a wrangler login prompt when a secret is missing.
      # It only tests whether the values are empty; it never prints them.
      - name: Check Cloudflare secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "Both Cloudflare secrets are set."

      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install the API's dependencies
        run: npm ci

      # The id of a D1 database is not a secret, but it belongs to the account, so it is not committed:
      # look the database up by name (create it the first time) and write its id into wrangler.toml here.
      - name: Create the D1 database if needed and set its id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "booking-system") | .uuid'; }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler d1 create booking-system
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not find or create the D1 database booking-system."
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          grep -q "^database_id = \"$id\"" wrangler.toml

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --env production

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event.repository.visibility == 'public' || vars.DEPLOY_PAGES == 'true')
    # The site goes live only after the API it calls.
    needs: [build, deploy-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and a running deployment is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
