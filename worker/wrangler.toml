# The booking system's API: a Cloudflare Worker with a D1 database (D-006).
#
# This file has no account id and no token. Locally nothing is needed: `npm run dev` keeps the database
# under .wrangler/state. CI deploys with the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets of the
# GitHub repository and writes the real database_id below at deploy time, without committing it (BK-011).

name = "booking-system-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# No usage data from wrangler, for anyone who runs it from this repository.
send_metrics = false

[[d1_databases]]
binding = "DB"
database_name = "booking-system"
# Placeholder for local runs and tests; the deploy job replaces it with the id of the real database.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# Every day at 00:10 UTC = 07:10 Thai time, just after the free plan's daily quotas reset at 00:00 UTC:
# deletes every sandbox older than SANDBOX_TTL_HOURS (src/purge.ts).
crons = ["10 0 * * *"]

# Settings that are not secret (D-004, D-008). Every value is a string; src/settings.ts reads them.
[vars]
# Rows the API may write to D1 per UTC day: 60% of the free plan's 100,000. Above it, writes answer
# 503 demo_full and reads keep working until 00:00 UTC.
D1_WRITE_BUDGET = "60000"
# The share of that budget one IP address (IPv6: one /64) may write per UTC day, all its sandboxes
# together: 5% = 3,000 rows. A visitor who books and makes ten back office changes writes about 80, so
# dozens of visitors behind one shared address still fit. Above it, that address's writes answer
# 429 rate_limited until 00:00 UTC (D-011).
D1_WRITE_BUDGET_PER_IP_PERCENT = "5"
# A sandbox (one visitor's copy of the data) is deleted, or treated as deleted, after this many hours.
SANDBOX_TTL_HOURS = "24"
# Rate limits (BK-001): bookings per sandbox per 10 minutes, back office changes per sandbox per minute
# (signing in to an existing sandbox and signing out count as changes), wrong passwords per IP address per
# 10 minutes, new sandboxes per IP address (IPv6: per /64) per 10 minutes.
BOOKINGS_PER_10_MINUTES = "5"
# New bookings per sandbox in its whole life (24 hours): every read of a sandbox's bookings stays small,
# so one visitor cannot use up D1's 5,000,000 rows read a day for everyone.
BOOKINGS_PER_SANDBOX = "30"
ADMIN_CHANGES_PER_MINUTE = "60"
# Back office sessions per sandbox: signing in once more ends the oldest one (D-011).
SESSIONS_PER_SANDBOX = "5"
LOGIN_FAILURES_PER_10_MINUTES = "10"
SANDBOXES_PER_10_MINUTES_PER_IP = "5"
# Origins of the pages allowed to call the API (CORS), separated by commas: the local preview here;
# the production origin https://<owner>.github.io is added when the repository exists (BK-011).
ALLOWED_ORIGINS = "http://localhost:4176"
